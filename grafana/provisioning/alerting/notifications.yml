apiVersion: 1
contactPoints:
  - orgId: 1
    name: guidepc2-log
    receivers:
      - uid: guidepc2-log-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:3001/api/alerts/webhook
          httpMethod: POST
          uploadImage: false
policies:
  - orgId: 1
    receiver: guidepc2-log
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h