apiVersion: 1
groups:
  - orgId: 1
    name: guidepc2
    folder: GuidePC 2
    interval: 1m
    rules:
      - uid: guidepc2-cpu-high
        title: "GuidePC 2: CPU acima de 90%"
        condition: C
        data:
          - refId: A
            datasourceUid: guidepc2-metrics
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: frser-sqlite-datasource
                uid: guidepc2-metrics
              queryType: table
              rawQueryText: "SELECT ts, value FROM samples WHERE metric = 'cpu.total' AND ts >= $__from / 1000 AND ts < $__to / 1000 ORDER BY ts ASC"
              queryText: "SELECT ts, value FROM samples WHERE metric = 'cpu.total' AND ts >= $__from / 1000 AND ts < $__to / 1000 ORDER BY ts ASC"
              timeColumns: ["ts"]
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: LAST
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  query:
                    params: [B]
                  reducer:
                    type: last
                  operator:
                    type: and
                  evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          summary: "CPU acima de 90% por 2 minutos"
        labels:
          severity: warning
      - uid: guidepc2-mem-high
        title: "GuidePC 2: Memória acima de 90%"
        condition: C
        data:
          - refId: A
            datasourceUid: guidepc2-metrics
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: frser-sqlite-datasource
                uid: guidepc2-metrics
              queryType: table
              rawQueryText: "SELECT ts, value FROM samples WHERE metric = 'mem.used' AND ts >= $__from / 1000 AND ts < $__to / 1000 ORDER BY ts ASC"
              queryText: "SELECT ts, value FROM samples WHERE metric = 'mem.used' AND ts >= $__from / 1000 AND ts < $__to / 1000 ORDER BY ts ASC"
              timeColumns: ["ts"]
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: LAST
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  query:
                    params: [B]
                  reducer:
                    type: last
                  operator:
                    type: and
                  evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Memória acima de 90% por 5 minutos"
        labels:
          severity: warning
      - uid: guidepc2-disk-high
        title: "GuidePC 2: Disco acima de 85%"
        condition: C
        data:
          - refId: A
            datasourceUid: guidepc2-metrics
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              datasource:
                type: frser-sqlite-datasource
                uid: guidepc2-metrics
              queryType: table
              rawQueryText: "SELECT ts, MAX(value) AS value FROM samples WHERE metric LIKE 'disk.usage.%' AND ts >= $__from / 1000 AND ts < $__to / 1000 GROUP BY ts ORDER BY ts ASC"
              queryText: "SELECT ts, MAX(value) AS value FROM samples WHERE metric LIKE 'disk.usage.%' AND ts >= $__from / 1000 AND ts < $__to / 1000 GROUP BY ts ORDER BY ts ASC"
              timeColumns: ["ts"]
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: LAST
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - type: query
                  query:
                    params: [B]
                  reducer:
                    type: last
                  operator:
                    type: and
                  evaluator:
                    type: gt
                    params: [85]
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: "Alguma partição acima de 85% por 5 minutos"
        labels:
          severity: warning